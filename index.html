<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- Sin esto, el móvil renderiza como si fuera un escritorio de 980px y hace zoom out -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c0392b">
  <meta name="description" content="Frases, kana, números y quiz para viajar a Japón">

  <!-- Content Security Policy: el navegador solo ejecuta scripts y carga recursos
       de nuestro propio dominio ('self'). Si algún texto se colara sin escapar,
       no podría cargar ni ejecutar código externo. Ver AGENTS.md → Seguridad. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <!-- No enviar la URL de la app a otros sitios -->
  <meta name="referrer" content="no-referrer">
  <title>日本語 de viaje</title>

  <!-- PWA: el manifest describe la app instalada (nombre, iconos, colores) -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">日本語 <span>de viaje</span></a>
    <!-- Oculto hasta que Chrome indique que la app se puede instalar (ver pwa.js) -->
    <button id="install-btn" class="install-btn" hidden>📲 Instalar</button>
  </header>

  <!-- Aquí el router "pinta" la vista activa -->
  <main id="app"></main>

  <!-- type="module" permite usar import/export entre archivos -->
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>
